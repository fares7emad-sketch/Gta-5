name: Rehost Android NDK

on:
  workflow_dispatch:

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NDK
        run: |
          curl -L -o android-ndk-r27c-linux.zip \
            "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip"
          ls -lh android-ndk-r27c-linux.zip

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ndk-r27c
          name: "Android NDK r27c (Linux)"
          files: android-ndk-r27c-linux.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
