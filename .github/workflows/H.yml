name: Download VS Code and Release

on:
  workflow_dispatch:

jobs:
  fetch-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download VS Code
        run: |
          curl -L -o VSCodeUserSetup-x64.exe \
            "https://code.visualstudio.com/sha/download?build=stable&os=win32-x64-user"

          ls -lh

      - name: Create Release & Upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vscode-win-v1.0
          name: "VS Code Windows Release"
          files: VSCodeUserSetup-x64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
